# Lint rules for the Python code (docs/CODE_STYLE.md). CI runs `ruff check .` on every pull request.
#
#   uvx ruff check .          # what CI runs
#   uvx ruff check --fix .    # apply the safe fixes
#
# Ruff is a lint gate only: the code is not machine-formatted, so `ruff format` is not run.

target-version = "py312"
line-length = 120

[lint]
select = [
    "E",    # pycodestyle errors
    "F",    # pyflakes: unused imports and names, undefined names
    "I",    # import order
    "B",    # bugbear: likely bugs
    "UP",   # modern syntax for the target Python
    "SIM",  # simpler equivalent code
]
ignore = [
    # zip() here walks lists built from the same source. strict=True would turn a length
    # mismatch into an exception (a behavior change), and strict=False on every call is noise.
    "B905",
    # A word list written as one string and split reads and edits better than a list literal.
    "SIM905",
]

[lint.per-file-ignores]
# Prompt text the models read as written: wrapping a line would change the prompt.
"app/prompts.py" = ["E501"]
# Test data, fake model replies and assertion messages read better on one line.
"tests/**" = ["E501"]

[lint.flake8-bugbear]
# FastAPI's dependency markers are meant to be called in argument defaults.
extend-immutable-calls = [
    "fastapi.Depends",
    "fastapi.Query",
    "fastapi.Header",
    "fastapi.Cookie",
    "fastapi.Body",
]

[lint.isort]
known-first-party = ["app", "evals", "indexer", "scripts", "localvoice"]
